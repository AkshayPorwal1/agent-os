<div class="app-shell">
  <!-- Header -->
  <header class="app-header">
    <div class="header-content">
      <div class="logo-area">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <div>
          <h1>AgentOS</h1>
          <span class="tagline">Intelligent AI Assistant</span>
        </div>
      </div>
      <div class="header-badges">
        <span class="badge online-badge">
          <span class="badge-dot online"></span>
          Ready &amp; Online
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="app-main">
    <app-command-center
      (taskSubmitted)="onTaskSubmitted($event)"
    ></app-command-center>

    <app-task-activity
      [tasks]="tasks"
    ></app-task-activity>

    <app-memory-vault></app-memory-vault>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>AgentOS &bull; Autonomous AI System</p>
  </footer>
</div>
